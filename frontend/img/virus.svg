<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="vglow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Dark purple BG -->
  <rect width="400" height="400" fill="#080012"/>
  <!-- Grid of binary bits as background texture -->
  <text font-family="monospace" font-size="10" fill="#AA00FF22">
    <tspan x="10" y="20">01001000 01000001 01000011 01001011</tspan>
    <tspan x="10" y="34">11010100 00110101 10100011 01101100</tspan>
    <tspan x="10" y="48">00101001 11001010 00011101 10010110</tspan>
    <tspan x="10" y="62">10110100 01010011 11101001 00110101</tspan>
    <tspan x="10" y="350">01001000 01000001 01000011 01001011</tspan>
    <tspan x="10" y="364">11010100 00110101 10100011 01101100</tspan>
    <tspan x="10" y="378">00101001 11001010 00011101 10010110</tspan>
  </text>
  <!-- Virus body — pixelated bio-horror core -->
  <rect x="155" y="130" width="90" height="90" rx="6" fill="#1A0025" stroke="#BB00FF" stroke-width="2" filter="url(#vglow)"/>
  <!-- Pixel "eyes" -->
  <rect x="172" y="155" width="20" height="20" fill="#BB00FF" rx="2"/>
  <rect x="208" y="155" width="20" height="20" fill="#BB00FF" rx="2"/>
  <!-- Pupils -->
  <rect x="178" y="161" width="8" height="8" fill="#FF00AA"/>
  <rect x="214" y="161" width="8" height="8" fill="#FF00AA"/>
  <!-- Teeth / corrupted mouth -->
  <rect x="168" y="192" width="64" height="14" fill="#BB00FF" rx="2"/>
  <rect x="172" y="194" width="8" height="10" fill="#080012"/>
  <rect x="184" y="194" width="8" height="10" fill="#080012"/>
  <rect x="196" y="194" width="8" height="10" fill="#080012"/>
  <rect x="208" y="194" width="8" height="10" fill="#080012"/>
  <rect x="220" y="194" width="8" height="10" fill="#080012"/>
  <!-- Circuit tendrils radiating out -->
  <g stroke="#BB00FF" stroke-width="2" fill="none" filter="url(#vglow)" opacity="0.8">
    <line x1="155" y1="175" x2="90" y2="140"/>   <circle cx="90" cy="140" r="6" fill="#BB00FF" stroke="none"/>
    <line x1="155" y1="175" x2="70" y2="220"/>   <circle cx="70"  cy="220" r="5" fill="#FF00AA" stroke="none"/>
    <line x1="200" y1="130" x2="180" y2="70"/>   <circle cx="180" cy="70"  r="5" fill="#BB00FF" stroke="none"/>
    <line x1="200" y1="130" x2="240" y2="60"/>   <circle cx="240" cy="60"  r="6" fill="#FF00AA" stroke="none"/>
    <line x1="245" y1="175" x2="320" y2="130"/>  <circle cx="320" cy="130" r="5" fill="#BB00FF" stroke="none"/>
    <line x1="245" y1="175" x2="340" y2="220"/>  <circle cx="340" cy="220" r="6" fill="#FF00AA" stroke="none"/>
    <line x1="200" y1="220" x2="160" y2="300"/>  <circle cx="160" cy="300" r="5" fill="#BB00FF" stroke="none"/>
    <line x1="200" y1="220" x2="250" y2="310"/>  <circle cx="250" cy="310" r="6" fill="#FF00AA" stroke="none"/>
    <!-- Short right-angle connections at ends -->
    <polyline points="90,140 80,140 80,155"/>
    <polyline points="70,220 55,220 55,240"/>
    <polyline points="180,70 180,55 200,55"/>
    <polyline points="240,60 240,50 220,50"/>
    <polyline points="320,130 340,130 340,115"/>
    <polyline points="340,220 355,220 355,200"/>
    <polyline points="160,300 145,300 145,280"/>
    <polyline points="250,310 265,310 265,330"/>
  </g>
  <!-- "DA VINCI" text around virus -->
  <text x="200" y="115" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="14" font-weight="700"
        fill="#BB00FF" filter="url(#vglow)" letter-spacing="6">DA VINCI VIRUS</text>
  <!-- Warning text -->
  <text x="200" y="360" text-anchor="middle" font-family="monospace" font-size="11" fill="#BB00FF"
        filter="url(#vglow)" letter-spacing="3">MALWARE ACTIVE</text>
  <!-- Label -->
  <text x="200" y="396" text-anchor="middle" font-family="monospace" font-size="9" fill="#BB00FF44"
        letter-spacing="3">[ DA VINCI VIRUS ART — 400×400 ]</text>
</svg>
