<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <filter id="sglow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="skull-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2222"/>
      <stop offset="100%" stop-color="#660000"/>
    </linearGradient>
  </defs>
  <!-- Dark BG -->
  <rect width="480" height="320" fill="#0A0000"/>
  <!-- Scan lines pattern -->
  <line x1="0" y1="50" x2="480" y2="50" stroke="#FF222211" stroke-width="1"/>
  <line x1="0" y1="100" x2="480" y2="100" stroke="#FF222211" stroke-width="1"/>
  <line x1="0" y1="150" x2="480" y2="150" stroke="#FF222211" stroke-width="1"/>
  <line x1="0" y1="200" x2="480" y2="200" stroke="#FF222211" stroke-width="1"/>
  <line x1="0" y1="250" x2="480" y2="250" stroke="#FF222211" stroke-width="1"/>
  <line x1="0" y1="300" x2="480" y2="300" stroke="#FF222211" stroke-width="1"/>
  <!-- Skull cranium -->
  <ellipse cx="240" cy="130" rx="100" ry="110" fill="#0D0000" stroke="url(#skull-grad)" stroke-width="2.5" filter="url(#sglow)"/>
  <!-- Eye sockets -->
  <ellipse cx="196" cy="118" rx="28" ry="30" fill="#FF2222" filter="url(#sglow)" opacity="0.9"/>
  <ellipse cx="284" cy="118" rx="28" ry="30" fill="#FF2222" filter="url(#sglow)" opacity="0.9"/>
  <!-- Pupils (inner dark) -->
  <ellipse cx="196" cy="118" rx="16" ry="18" fill="#0A0000"/>
  <ellipse cx="284" cy="118" rx="16" ry="18" fill="#0A0000"/>
  <!-- Nose cavity -->
  <path d="M228,155 L252,155 L240,178 Z" fill="#FF2222" opacity="0.7"/>
  <!-- Jaw -->
  <rect x="165" y="220" width="150" height="55" rx="8" fill="#0D0000" stroke="#FF2222" stroke-width="2"/>
  <!-- Teeth (6 teeth) -->
  <rect x="177" y="222" width="18" height="30" rx="2" fill="#FF2222" opacity="0.8"/>
  <rect x="201" y="222" width="18" height="30" rx="2" fill="#FF2222" opacity="0.8"/>
  <rect x="225" y="222" width="18" height="30" rx="2" fill="#FF2222" opacity="0.8"/>
  <rect x="249" y="222" width="18" height="30" rx="2" fill="#FF2222" opacity="0.8"/>
  <rect x="273" y="222" width="18" height="30" rx="2" fill="#FF2222" opacity="0.8"/>
  <!-- Skull cheekbones -->
  <line x1="152" y1="160" x2="140" y2="220" stroke="#FF2222" stroke-width="2" filter="url(#sglow)"/>
  <line x1="328" y1="160" x2="340" y2="220" stroke="#FF2222" stroke-width="2" filter="url(#sglow)"/>
  <!-- Side decoration: circuit lines -->
  <g stroke="#FF2222" stroke-width="1" fill="none" opacity="0.4">
    <line x1="30" y1="80" x2="90" y2="80"/>  <line x1="90" y1="80" x2="90" y2="110"/>
    <line x1="30" y1="120" x2="75" y2="120"/>
    <line x1="30" y1="160" x2="70" y2="160"/> <line x1="70" y1="160" x2="70" y2="190"/>
    <circle cx="30" cy="80" r="4" fill="#FF2222"/>
    <circle cx="30" cy="120" r="4" fill="#FF2222"/>
    <circle cx="30" cy="160" r="4" fill="#FF2222"/>
    <line x1="450" y1="80" x2="390" y2="80"/>  <line x1="390" y1="80" x2="390" y2="110"/>
    <line x1="450" y1="120" x2="405" y2="120"/>
    <line x1="450" y1="160" x2="410" y2="160"/> <line x1="410" y1="160" x2="410" y2="190"/>
    <circle cx="450" cy="80" r="4" fill="#FF2222"/>
    <circle cx="450" cy="120" r="4" fill="#FF2222"/>
    <circle cx="450" cy="160" r="4" fill="#FF2222"/>
  </g>
  <!-- "GAME OVER" text above skull -->
  <text x="240" y="30" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="18" font-weight="900"
        fill="#FF2222" filter="url(#sglow)" letter-spacing="8">GAME OVER</text>
  <!-- Placeholder label -->
  <text x="240" y="311" text-anchor="middle" font-family="monospace" font-size="9" fill="#FF222244"
        letter-spacing="3">[ GAME OVER SKULL — 480×320 ]</text>
</svg>
